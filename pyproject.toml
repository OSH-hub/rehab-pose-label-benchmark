[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rehabal-pose"
version = "1.0.0"
description = "Benchmark code for label quality and label quantity in rehabilitation pose estimation"
license = { text = "AGPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "matplotlib==3.10.0",
    "PyYAML==6.0.2",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pyarrow==25.0.0"]
training = [
    "opencv-python==4.12.0.88",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "ultralytics==8.3.228",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: heavy real-data/GPU test; not used in CPU-only checks",
]
